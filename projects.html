<html>

<head>
	<title>Projects – Justin Long</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<style>
		.project-card {
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 2px 12px rgba(0,0,0,0.08);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			height: 100%;
		}
		.project-card-icon {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 140px;
			font-size: 3.5em;
			color: #fff;
		}
		.project-card-icon.websites { background: #4a90d9; }
		.project-card-icon.games    { background: #e07b54; }
		.project-card-icon.art      { background: #7b68c8; }

		.project-card-body {
			padding: 1.4em 1.5em 1.5em;
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		.project-card-body header h3 {
			margin-bottom: 0.2em;
		}
		.project-tag {
			display: inline-block;
			font-size: 0.7em;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			padding: 0.2em 0.7em;
			border-radius: 3px;
			margin-bottom: 0.8em;
			color: #fff;
		}
		.project-tag.websites { background: #4a90d9; }
		.project-tag.games    { background: #e07b54; }
		.project-tag.art      { background: #7b68c8; }

		.project-card-body p {
			flex: 1;
			font-size: 0.95em;
			line-height: 1.6;
		}
		.project-card-body .actions {
			margin-top: 1em;
			margin-bottom: 0;
		}
		.project-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 2em;
			margin-top: 1.5em;
		}
		@media (max-width: 840px) {
			.project-grid {
				grid-template-columns: repeat(2, 1fr);
			}
		}
		@media (max-width: 480px) {
			.project-grid {
				grid-template-columns: 1fr;
			}
		}
		.section-heading {
			border-bottom: 2px solid #e8e8e8;
			padding-bottom: 0.5em;
			margin-bottom: 0;
			margin-top: 2.5em;
		}
		.section-heading:first-of-type {
			margin-top: 0;
		}
	</style>
</head>

<body class="no-sidebar is-preload">
	<div id="page-wrapper">

		<include src="partials/header.html" />

		<!-- Main -->
		<div class="wrapper">
			<div class="container" id="main">

				<article id="content">
					<header>
						<h2>Projects</h2>
						<p>Take a look at what I've built. Tell me which is your favorite!</p>
					</header>

					<projects-from src="partials/projects.json" />

				</article>
			</div>
		</div>

		<!-- Footer -->
		<div id="footer-wrapper">
			<div id="copyright" class="container">
				<ul class="menu">
					<li>&copy; Justin Long. All rights reserved.</li>
				</ul>
			</div>
		</div>

	</div>

	<!-- Scripts -->
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/jquery.dropotron.min.js"></script>
	<script src="assets/js/browser.min.js"></script>
	<script src="assets/js/breakpoints.min.js"></script>
	<script src="assets/js/util.js"></script>
	<script src="assets/js/main.js"></script>

</body>

</html>
