<html>

<head>
	<title>Projects – Justin Long</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<style>
		.project-card {
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 2px 12px rgba(0,0,0,0.08);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			height: 100%;
			text-decoration: none;
			color: inherit;
			cursor: pointer;
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}
		.project-card:hover {
			transform: scale(1.04);
			box-shadow: 0 8px 28px rgba(0,0,0,0.16);
		}
		.project-card-icon {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 140px;
			font-size: 3.5em;
			color: #fff;
		}
		.project-card-icon.websites { background: #4a90d9; }
		.project-card-icon.games    { background: #e07b54; }
		.project-card-icon.art      { background: #7b68c8; }

		.project-card-body {
			padding: 1.4em 1.5em 1.5em;
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		.project-card-body header h3 {
			margin-bottom: 0.2em;
		}
		.project-tag {
			display: inline-block;
			font-size: 0.7em;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			padding: 0.2em 0.7em;
			border-radius: 3px;
			margin-bottom: 0.8em;
			color: #fff;
		}
		.project-tag.websites { background: #4a90d9; }
		.project-tag.games    { background: #e07b54; }
		.project-tag.art      { background: #7b68c8; }

		.project-card-body p {
			flex: 1;
			font-size: 0.95em;
			line-height: 1.6;
		}
		.project-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 2em;
			margin-top: 1.5em;
		}
		@media (max-width: 840px) {
			.project-grid {
				grid-template-columns: repeat(2, 1fr);
			}
		}
		@media (max-width: 480px) {
			.project-grid {
				grid-template-columns: 1fr;
			}
		}
		.section-heading {
			border-bottom: 2px solid #e8e8e8;
			padding-bottom: 0.5em;
			margin-bottom: 0;
			margin-top: 2.5em;
		}
		.section-heading:first-of-type {
			margin-top: 0;
		}

		/* ── Projects layout: sidebar + content ── */
		#projects-layout {
			display: flex;
			gap: 2.5em;
			align-items: flex-start;
		}

		#projects-sidebar {
			width: 110px;
			flex-shrink: 0;
			position: sticky;
			top: 2em;
		}

		#projects-sidebar ul {
			list-style: none;
			margin: 0;
			padding: 0;
			border-left: 2px solid #e8e8e8;
		}

		#projects-sidebar li + li {
			margin-top: 0.25em;
		}

		#projects-sidebar a {
			display: flex;
			align-items: center;
			gap: 0.55em;
			padding: 0.45em 0 0.45em 1em;
			color: #aaa;
			text-decoration: none;
			font-size: 0.78em;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			transition: color 0.2s ease;
			border: none;
		}

		#projects-sidebar a:hover {
			color: #555;
		}

		#projects-sidebar a.active {
			color: #333;
		}

		#projects-sidebar .dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			flex-shrink: 0;
			opacity: 0.45;
			transition: opacity 0.2s ease;
		}

		#projects-sidebar a.active .dot,
		#projects-sidebar a:hover .dot {
			opacity: 1;
		}

		.dot.websites { background: #4a90d9; }
		.dot.games    { background: #e07b54; }
		.dot.art      { background: #7b68c8; }

		#projects-content {
			flex: 1;
			min-width: 0;
		}

		@media (max-width: 736px) {
			#projects-layout {
				flex-direction: column;
				gap: 0;
			}
			#projects-sidebar {
				width: 100%;
				position: static;
				margin-bottom: 1.5em;
			}
			#projects-sidebar ul {
				display: flex;
				border-left: none;
				border-bottom: 2px solid #e8e8e8;
				padding-bottom: 0.75em;
				gap: 1.5em;
			}
			#projects-sidebar li + li {
				margin-top: 0;
			}
			#projects-sidebar a {
				padding: 0 0;
			}
		}
	</style>
</head>

<body class="no-sidebar is-preload">
	<div id="page-wrapper">

		<div id="header-wrapper">
			<include src="partials/header.html" />
		</div>

		<!-- Main -->
		<div class="wrapper">
			<div class="container" id="main">

				<div id="projects-layout">

					<nav id="projects-sidebar">
						<ul>
							<li><a href="#websites" data-section="websites"><span class="dot websites"></span>Websites</a></li>
							<li><a href="#games" data-section="games"><span class="dot games"></span>Games</a></li>
							<li><a href="#art" data-section="art"><span class="dot art"></span>Art</a></li>
						</ul>
					</nav>

					<article id="projects-content">
						<header>
							<h2>Projects</h2>
							<p>Click a project to check it out. Tell me which is your favorite!</p>
						</header>

						<projects-from src="partials/projects.json" />

					</article>

				</div>
			</div>
		</div>

		<!-- Footer -->
		<div id="footer-wrapper">
			<div id="copyright" class="container">
				<ul class="menu">
					<li>&copy; Justin Long. All rights reserved.</li>
				</ul>
			</div>
		</div>

	</div>

	<!-- Sidebar active-section tracker -->
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			var sections = document.querySelectorAll('.section-heading[id]');
			var links    = document.querySelectorAll('#projects-sidebar a[data-section]');

			if (!sections.length || !links.length) return;

			// Mark first link active by default
			links[0].classList.add('active');

			var observer = new IntersectionObserver(function (entries) {
				entries.forEach(function (entry) {
					if (entry.isIntersecting) {
						links.forEach(function (l) { l.classList.remove('active'); });
						var active = document.querySelector(
							'#projects-sidebar a[data-section="' + entry.target.id + '"]'
						);
						if (active) active.classList.add('active');
					}
				});
			}, { rootMargin: '-15% 0px -75% 0px' });

			sections.forEach(function (s) { observer.observe(s); });
		});
	</script>

	<!-- Scripts -->
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/jquery.dropotron.min.js"></script>
	<script src="assets/js/browser.min.js"></script>
	<script src="assets/js/breakpoints.min.js"></script>
	<script src="assets/js/util.js"></script>
	<script src="assets/js/main.js"></script>

</body>

</html>
